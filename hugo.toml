baseURL = "https://juang970.github.io/"
languageCode = "en-us"
title = "Juan Gonzalez"
theme = "PaperMod"

# Syntax highlighting settings for code blocks
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true
noClasses = false
style = "monokai"

[params]
env = "production"
description = "Juan Gonzalez - Personal Website, Blog, and CV"
author = "Juan Gonzalez"
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
disableThemeToggle = false
defaultTheme = "auto" # auto, dark, or light

[params.profileMode]
enabled = true
title = "Juan Gonzalez"
subtitle = "Software Engineer & Researcher"
imageUrl = "" # Optional: add a profile image URL here
imageWidth = 120
imageHeight = 120
imageTitle = "Juan Gonzalez"

[[params.profileMode.buttons]]
name = "About / CV"
url = "/about"

[[params.profileMode.buttons]]
name = "Projects"
url = "/projects"

[[params.profileMode.buttons]]
name = "Blog"
url = "/posts"

[[params.socialIcons]]
name = "github"
url = "https://github.com/juang970"

# Main Menu
[[menu.main]]
identifier = "about"
name = "About"
url = "/about"
weight = 10

[[menu.main]]
identifier = "projects"
name = "Projects"
url = "/projects"
weight = 20

[[menu.main]]
identifier = "blog"
name = "Blog"
url = "/posts"
weight = 30
